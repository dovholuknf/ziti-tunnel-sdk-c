# callable workflows' jobs appear in the calling workflow's run, so clicking this workflow in GitHub shows no runs
name: Callable CMake Build

on:
  workflow_dispatch:
  workflow_call:

# no concurrency constraints for callable workflows, set in caller instead

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.preset }}
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: macOS x86_64
            preset: macOS-x64

          - os: macos-15
            name: macOS arm64
            preset: macOS-arm64

          - os: windows-2022
            name: Windows x86_64
            preset: windows-x64-mingw

          - os: windows-2022
            name: Windows x86_64(win32crypto)
            preset: windows-x64-win32crypto

          - os: windows-2022
            name: Windows arm64
            preset: windows-arm64-vs2022

          - os: ubuntu-22.04
            name: Linux x86_64
            preset: linux-x64

          - os: ubuntu-22.04
            name: Linux arm
            preset: linux-arm

          - os: ubuntu-22.04
            name: Linux arm64
            preset: linux-arm64

    steps:
      - name: Debug action
        uses: hmarr/debug-action@v3

      - name: checkout workspace
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The repository variable CI_STUB=1 skips the compile and fabricates the artifacts the downstream
      # jobs download, so a run exercises this workflow's shape - job graph, matrix, gating, artifact
      # names - in about a minute instead of fifteen. A repository variable rather than an env var
      # because a called workflow does not inherit the caller's env. Set it on a fork, never upstream.
      - name: Run CMake Composite Action
        if: vars.CI_STUB != '1'
        uses: ./.github/actions/build
        with:
          preset: ${{ matrix.preset }}
          target: bundle

      - name: Stub the build
        if: vars.CI_STUB == '1'
        shell: bash
        run: |
          set -o errexit
          mkdir -p ./build/bundle ./build/programs/ziti-edge-tunnel
          echo "stub for ${{ matrix.preset }}" > ./build/programs/ziti-edge-tunnel/ziti-edge-tunnel
          # the name the integration jobs unzip: ziti-edge-tunnel-<OS>_<arch>.zip
          ( cd ./build/programs/ziti-edge-tunnel \
            && zip -q ../../bundle/ziti-edge-tunnel-stub.zip ziti-edge-tunnel )

      - name: list bundle artifacts
        run: ls -R
        working-directory: ./build/bundle/

      - name: list program artifacts
        run: ls -R
        working-directory: ./build/programs/ziti-edge-tunnel/

      - name: upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.preset }}
          path: ./build/bundle/ziti-edge-tunnel-*.zip
          if-no-files-found: error

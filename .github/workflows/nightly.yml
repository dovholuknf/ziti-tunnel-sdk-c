name: Nightly Integration Tests (ziti main)

# Runs ZET integration tests against ziti main
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# LOOP BRANCH: one scope per run so repeat dispatches do not cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  call-cmake-build:
    name: Call CMake Build
    uses: ./.github/workflows/cmake.yml

  # Nightly carries the slow suites (slowtests build tag) and the legacy-auth topology.
  integration-tests:
    name: Integration Tests (${{ matrix.topology.label }})
    needs: [ call-cmake-build ]
    strategy:
      fail-fast: false
      matrix:
        topology:
          # LOOP BRANCH: main-ha only, the only topology adminRemovedMfa fails on
          - { label: main-ha, cluster-size: "3", auth: OIDC }
    uses: ./.github/workflows/integration-tests.yml
    with:
      # LOOP BRANCH: the candidate fix for the non-replicated admin MFA removal
      ziti-ref: fix-ha-admin-mfa-removal
      label: ${{ matrix.topology.label }}
      cluster-size: ${{ matrix.topology.cluster-size }}
      auth: ${{ matrix.topology.auth }}
      slow-tests: true
    secrets: inherit

